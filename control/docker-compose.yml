# Local test database for the control plane (ADR 0110). Never used for anything but tests and local dev.
# The bootstrap user is offload_migrator (owner of every table); migrations create the offload_app role.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: offload_migrator
      POSTGRES_PASSWORD: offload
      POSTGRES_DB: offload_test
    ports:
      - "127.0.0.1:${OFFLOAD_PG_PORT:-54329}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offload_migrator -d offload_test"]
      interval: 1s
      timeout: 3s
      retries: 30
